appId: com.mizuki.Ohashi.Pilll.dev
---
# 初期設定で「ヤーズフレックスの方ですか？」に「はい」と答え、
# 今日飲む番号 → 開始番号 (既定の1日目のまま) → 前回の休薬 (入力をスキップ) → 服用タイミング → プレミアムトライアルの順に進み、ホーム画面に到達することを確認する。
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: allow
- waitForAnimationToEnd

# 通知許可ダイアログは起動の数秒後に出ることがある (GitHub Actions の run 40047619937 では最初のページの上に残って assert を塞いだ)。
# 最大 15 秒待ってから、出ていれば許可をタップする
- extendedWaitUntil:
    visible: "許可"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: "許可"
    commands:
      - tapOn: "許可"
      - waitForAnimationToEnd

# 「ヤーズフレックスの方ですか？」→ はい
# CI の Simulator ではクリーンインストール直後の起動に時間がかかるため表示を待つ。
# 通知許可ダイアログが上の 15 秒より後に出ると、下の画面の文字を Maestro が検出できず待ちが失敗する
# (maestro-e2e run 40455785333 の失敗時の画面)。最大 60 秒の間、ダイアログが出ていれば許可して待ち直す
- repeat:
    times: 6
    while:
      notVisible: "ヤーズフレックスの方ですか？"
    commands:
      - runFlow:
          when:
            visible: "許可"
          commands:
            - tapOn: "許可"
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "ヤーズフレックスの方ですか？"
          timeout: 10000
          optional: true
- assertVisible: "ヤーズフレックスの方ですか？"
- tapOn: "はい"
- waitForAnimationToEnd
# CI の Simulator では「はい」からの画面遷移が waitForAnimationToEnd より遅れ、遷移の途中で下のピルをタップして選択されないことがある
# (maestro-e2e run 40751368564 の 2 回目の失敗時の画面は、ピルが未選択の今日の番号の画面だった) ため、遷移先の表示を待つ
- extendedWaitUntil:
    visible: ".*飲む・飲んだピルの番号をタップ.*"
    timeout: 30000
- waitForAnimationToEnd

# 今日飲む番号: 1枚目の最初のピルを座標でタップ (ピルシート内の Flutter のピルは Maestro がテキストで検出できないため)
# iPhone 17 で 1 番のピルの丸は (21%,34%)。32% は番号の文字の位置でタップが効かない (maestro-e2e run 39906545518 の失敗時の画面で確認)
- tapOn:
    point: "21%,34%"
- waitForAnimationToEnd
- assertVisible: ".*に飲むピルは.*"
- tapOn: "次へ"
- waitForAnimationToEnd

# 開始番号: ピルシートのプレビューと「1日目」のピッカーが出る。既定の1日目のまま次へ
- assertVisible: "シートの始まりは周期上\n何番目の服用ですか？"
- assertVisible: "シート開始前の休薬からの経過日数を元にお答えください"
- assertVisible: "次は前回の休薬を入力します"
- tapOn: "次へ"
- waitForAnimationToEnd

# 前回の休薬: 「休薬中でまだ再開していない」をオンにすると「休薬して今日で何日目」(既定 4日目) の欄が出る。オフに戻してから
# ピルをタップせずに「休薬の入力はスキップ」→ 確認ダイアログで「スキップする」→ 服用タイミングへ進む
- assertVisible: "休薬した時のピルを\nタップしてください"
- assertVisible: "休薬中でまだ再開していない"
- tapOn: "休薬中でまだ再開していない"
- waitForAnimationToEnd
- assertVisible: "休薬して今日で何日目"
- assertVisible: "4日目"
- takeScreenshot: "yaz_flex_rest_duration_resting"
- tapOn: "休薬中でまだ再開していない"
- waitForAnimationToEnd
- assertNotVisible: "休薬して今日で何日目"
- tapOn: "休薬の入力はスキップ"
- waitForAnimationToEnd
- assertVisible: "休薬の入力をスキップします"
- tapOn: "スキップする"
- waitForAnimationToEnd

# 服用タイミング → そのまま次へ
- tapOn: "次へ"
- waitForAnimationToEnd

# プレミアムトライアル → アプリ開始
# 初期設定の保存を待ってから出る画面で、CI の Simulator では tapOn の待ち時間を超えることがあるため 30 秒まで表示を待つ
# (feature_appeal/subflows/initial_setup.yaml と同じ。maestro-e2e run 40106336852)
- extendedWaitUntil:
    visible: "アプリをはじめる"
    timeout: 30000
- tapOn: "アプリをはじめる"
- waitForAnimationToEnd
