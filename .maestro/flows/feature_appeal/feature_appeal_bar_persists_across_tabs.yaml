appId: com.mizuki.Ohashi.Pilll.dev
---
# 初期設定完了後にタブ切替が正常に動作し、ピルタブに戻ると Bar が表示されていることを確認する。
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: allow
# 起動直後に waitForAnimationToEnd を置かない理由はサブフローの先頭に書いている
- runFlow: subflows/initial_setup.yaml
- waitForAnimationToEnd
# ホーム画面 (ピルタブ) で Bar が表示される
# Bar はユーザー情報の読み込み後に出るため、CI の遅い Simulator でも間に合うよう 30 秒まで表示を待つ
- extendedWaitUntil:
    visible:
      id: "feature_appeal_bar"
    timeout: 30000
# 設定タブに切替 (タブは Image 型で text 検出不可のため座標タップ)
- tapOn:
    point: "88%,95%"
- waitForAnimationToEnd
# ピルタブに戻る
- tapOn:
    point: "12%,95%"
- waitForAnimationToEnd
# ピルタブに戻っても Bar が表示されている
# Bar はユーザー情報の読み込み後に出るため、CI の遅い Simulator でも間に合うよう 30 秒まで表示を待つ
- extendedWaitUntil:
    visible:
      id: "feature_appeal_bar"
    timeout: 30000
