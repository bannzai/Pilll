appId: com.mizuki.Ohashi.Pilll.dev
---
# 初期設定を自動で完了し、ホーム画面に到達するサブフロー。
# clearState: true で呼ばれる前提。

# 通知許可ダイアログは起動の数秒後に出ることがあり、出ている間は下の画面を Maestro が検出できない
# (maestro-e2e run 40066823667 では「ヤーズフレックスの方ですか？」の上に残って待ちが失敗した)。
# yaz_flex/initial_setting_yaz_flex.yaml と同じく、最大 15 秒待ってから出ていれば許可をタップする
- extendedWaitUntil:
    visible: "許可"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: "許可"
    commands:
      - tapOn: "許可"
      - waitForAnimationToEnd

# Screen 0: 「ヤーズフレックスの方ですか？」→ いいえ (従来の導線)
# CI の Simulator ではクリーンインストール直後の起動に時間がかかり、tapOn の待ち時間を超えるため表示を待つ。
# 通知許可ダイアログが上の 15 秒より後に出ると、下の画面の文字を Maestro が検出できず待ちが失敗する
# (maestro-e2e run 40568779876 の失敗時の画面)。最大 60 秒の間、ダイアログが出ていれば許可して待ち直す
- repeat:
    times: 6
    while:
      notVisible: "ヤーズフレックスの方ですか？"
    commands:
      - runFlow:
          when:
            visible: "許可"
          commands:
            - tapOn: "許可"
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "ヤーズフレックスの方ですか？"
          timeout: 10000
          optional: true
- assertVisible: "ヤーズフレックスの方ですか？"
- tapOn: "いいえ"
- waitForAnimationToEnd

# Screen 1 (1/3): ピルシートタイプ選択
# まず「ピルの種類を選択」ボタンをタップしてモーダルを開く
- tapOn: "ピルの種類を選択"
- waitForAnimationToEnd
# モーダル内の最初のセル (21錠＋7日休薬) を座標タップ
# ボトムシート内の Flutter テキストは Maestro が検出できないため座標指定
- tapOn:
    point: "25%,33%"
- waitForAnimationToEnd
# 「次へ」で Screen 2 へ
- tapOn: "次へ"
- waitForAnimationToEnd

# Screen 2 (2/3): 今日の服用番号 → スキップ
- tapOn: "まだ分からない"
- waitForAnimationToEnd
# CI の Simulator ではページ遷移中のタップが効かず 2/3 に留まることがある (maestro-e2e run 39915603040 の失敗時の画面で確認) ため、
# 「まだ分からない」(2/3 の画面にだけある) が残っていればもう一度タップする
- runFlow:
    when:
      visible: "まだ分からない"
    commands:
      - tapOn: "まだ分からない"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "3/3"
    timeout: 10000

# Screen 3 (3/3): リマインダー設定 → そのまま次へ
- tapOn: "次へ"
- waitForAnimationToEnd

# Screen 4: プレミアムトライアル → アプリ開始
# 3/3 の「次へ」の後に初期設定の保存を待ってから出る画面で、CI の Simulator では tapOn の待ち時間を超えることがある
# (maestro-e2e run 40106336852 では失敗の時点で画面が出ていた) ため、30 秒まで表示を待つ
- extendedWaitUntil:
    visible: "アプリをはじめる"
    timeout: 30000
- tapOn: "アプリをはじめる"
- waitForAnimationToEnd
