appId: com.mizuki.Ohashi.Pilll.dev
---
# 初期設定完了後に AnnouncementBar 領域に FeatureAppeal の Bar が表示されることを確認する。
# トライアル中のユーザーは、匿名 (ログインプロバイダ未連携) でも FeatureAppeal が RecommendSignupGeneral より優先される (announcement_bar.dart)。
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: allow
- waitForAnimationToEnd
# 初期設定サブフローを実行
- runFlow: subflows/initial_setup.yaml
# ホーム画面到達後、データ読み込みを待つ
- waitForAnimationToEnd
# AnnouncementBar に FeatureAppeal の Bar が表示されることを id セレクタで確認 (どの機能の Bar かは日付のローテーションで変わる)
- assertVisible:
    id: "feature_appeal_bar"
